[project]
name = "optimizer-viz"
version = "0.1.0"
description = "Interactive visualization tool for understanding optimization algorithms - from SGD to Adam to Muon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",   # API framework
    "uvicorn>=0.23.0",    # ASGI server
    "numpy>=1.24.0",      # Numerical operations
]

[project.scripts]
optimizer-viz = "optimizer_viz.interactive:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optimizer_viz"]
